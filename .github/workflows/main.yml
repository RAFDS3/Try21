name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source zip
        run: |
          ZIP=$(find . -name 'LocalAI-source.zip' -not -path './.git/*' | head -1)
          if [ -n "$ZIP" ]; then unzip -o -q "$ZIP" -d .; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Install Android SDK parts
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Build debug APK
        run: |
          F=$(find . -name 'settings.gradle.kts' -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "settings.gradle.kts TIDAK DITEMUKAN"; exit 1; fi
          cd "$(dirname "$F")"
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LocalAI-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
